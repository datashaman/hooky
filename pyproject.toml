[project]
name = "hooky"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openrouter>=0.1.0",
    "typer>=0.26.8",
]

[project.scripts]
hooky = "scripts.hooky_cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]
