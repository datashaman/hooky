name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: |
          uv sync --locked --dev

      - name: Compile Python modules
        run: |
          uv run python -m compileall src/hooky

      - name: Run tests
        run: |
          uv run pytest -q

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Run actionlint
        uses: raven-actions/actionlint@v2.2.0
