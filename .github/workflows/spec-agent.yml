name: Spec Agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: spec-agent-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  generate-spec:
    name: Generate spec artifacts
    if: >-
      github.event.label.name == 'sdlc:spec' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Generate spec artifacts
        id: spec
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/spec_agent.py \
            --event "$GITHUB_EVENT_PATH" \
            --trigger-label "sdlc:spec" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create branch and commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${{ steps.spec.outputs.branch }}"
          git add docs/specs .workflow/artifacts/specs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "spec: draft issue #${{ github.event.issue.number }}"
          git push --set-upstream origin "${{ steps.spec.outputs.branch }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_url="$(gh pr create \
            --title "Spec: #${{ github.event.issue.number }} ${{ github.event.issue.title }}" \
            --body-file "${{ steps.spec.outputs.pr_body }}" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.spec.outputs.branch }}")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Comment on issue
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "Spec Agent created draft artifacts for human approval: ${{ steps.pr.outputs.url }}"
