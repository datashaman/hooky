schema_version: 1
pipeline:
  name: agentic-sdlc
  first_flow: issue_to_spec

github:
  spec_trigger_label: sdlc:spec

artifacts:
  root: docs/specs
  generated_marker: "<!-- generated-by: hooky-spec-agent -->"
  stage_roots:
    spec_public: docs/specs
    spec_sidecar: .workflow/artifacts/specs
    test: .workflow/artifacts/test-agent
    builder: .workflow/artifacts/builder-agent
    verifier: .workflow/artifacts/verifier-agent
    eval: .workflow/artifacts/eval-agent

agents:
  spec:
    context:
      project_files:
        - AGENTS.md
      static_root: .workflow/agents/spec/static
      templates_root: .workflow/agents/spec/templates
      selected_model: .workflow/agents/spec/selected_model.json
      dynamic_snapshot_files:
        - dynamic_context.json
        - context_snapshot.md
    responsibilities:
      - normalize_request
      - ask_only_blocking_questions
      - define_acceptance_criteria
      - identify_affected_components
      - identify_edge_cases
      - define_non_goals
      - produce_cost_estimate
      - recommend_model_routing
      - produce_implementation_test_plan
    forbidden:
      - write_production_code
      - modify_tests
      - invent_requirements
      - omit_human_approval
    requires_human_approval: true
    artifacts:
      writes:
        - docs/specs/<spec-id>/spec.md
        - docs/specs/<spec-id>/acceptance_tests.md
        - docs/specs/<spec-id>/risk_register.md
        - docs/specs/<spec-id>/cost_plan.md
        - docs/specs/<spec-id>/contract.json
        - docs/specs/<spec-id>/dynamic_context.json
        - docs/specs/<spec-id>/context_snapshot.md
        - docs/specs/<spec-id>/pull_request_body.md
      forbids:
        - production_code
        - executable_tests
  test:
    context:
      project_files:
        - AGENTS.md
      static_root: .workflow/agents/test/static
      templates_root: .workflow/agents/test/templates
      selected_model: .workflow/agents/test/selected_model.json
      dynamic_snapshot_files:
        - dynamic_context.json
        - context_snapshot.md
    responsibilities:
      - read_approved_specification
      - generate_unit_tests
      - generate_integration_tests
      - generate_regression_tests
      - create_fixtures_and_mocks
      - cover_acceptance_criteria
      - report_untestable_requirements
    forbidden:
      - write_production_code
      - weaken_tests
      - invent_requirements
      - ignore_acceptance_criteria
    requires_human_approval: true
    artifacts:
      reads:
        - docs/specs/<spec-id>/contract.json
      writes:
        - tests/generated/<approved-spec>/*
        - .workflow/artifacts/test-agent/<approved-spec>/contract.json
        - .workflow/artifacts/test-agent/<approved-spec>/dynamic_context.json
        - .workflow/artifacts/test-agent/<approved-spec>/context_snapshot.md
        - .workflow/artifacts/test-agent/<approved-spec>/test_report.md
      forbids:
        - production_code
        - dependency_manifests
  builder:
    context:
      project_files:
        - AGENTS.md
        - README.md
        - package.json
        - playwright.config.cjs
      static_root: .workflow/agents/builder/static
      templates_root: .workflow/agents/builder/templates
      selected_model: .workflow/agents/builder/selected_model.json
      dynamic_snapshot_files:
        - dynamic_context.json
        - context_snapshot.md
    responsibilities:
      - read_approved_specification
      - read_approved_tests
      - read_project_conventions
      - implement_behavior
      - run_tests
      - produce_build_report
    forbidden:
      - edit_tests
      - weaken_tests
      - scope_expansion
      - unrelated_refactoring
      - hidden_dependencies
      - deployments
    requires_verifier: true
    artifacts:
      reads:
        - .workflow/artifacts/test-agent/<approved-spec>/contract.json
        - tests/generated/<approved-spec>/*
      writes:
        - .workflow/artifacts/builder-agent/contract.json
        - .workflow/artifacts/builder-agent/dynamic_context.json
        - .workflow/artifacts/builder-agent/context_snapshot.md
        - .workflow/artifacts/builder-agent/build_report.md
      protected:
        - tests/**
        - .workflow/artifacts/test-agent/**
  verifier:
    context:
      project_files:
        - AGENTS.md
        - README.md
        - package.json
      static_root: .workflow/agents/verifier/static
      templates_root: .workflow/agents/verifier/templates
      selected_model: .workflow/agents/verifier/selected_model.json
      dynamic_snapshot_files:
        - dynamic_context.json
        - context_snapshot.md
    responsibilities:
      - validate_implementation_scope
      - run_test_suite
      - verify_test_integrity
      - check_acceptance_criteria_coverage
      - run_lint_static_security_checks
      - produce_verification_report
    forbidden:
      - edit_code
      - edit_tests
      - auto_fix_failures
      - pass_failed_checks
    artifacts:
      reads:
        - .workflow/artifacts/test-agent/**/contract.json
        - .workflow/artifacts/builder-agent/contract.json
      writes:
        - .workflow/artifacts/verifier-agent/contract.json
        - .workflow/artifacts/verifier-agent/dynamic_context.json
        - .workflow/artifacts/verifier-agent/context_snapshot.md
        - .workflow/artifacts/verifier-agent/verification_report.md
      protected:
        - tests/**
        - src/**
        - package.json
        - .workflow/artifacts/test-agent/**
        - .workflow/artifacts/builder-agent/**
  eval:
    context:
      project_files:
        - AGENTS.md
        - README.md
        - package.json
      static_root: .workflow/agents/eval/static
      templates_root: .workflow/agents/eval/templates
      selected_model: .workflow/agents/eval/selected_model.json
      dynamic_snapshot_files:
        - dynamic_context.json
        - context_snapshot.md
    responsibilities:
      - score_specification_alignment
      - score_maintainability
      - score_architecture_fit
      - evaluate_agent_trajectory
      - detect_hidden_assumptions
      - detect_overengineering
      - recommend_human_review
    forbidden:
      - edit_code
      - edit_tests
      - pass_failed_verification
    artifacts:
      reads:
        - docs/specs/**/contract.json
        - .workflow/artifacts/specs/**/contract.json
        - .workflow/artifacts/test-agent/**/contract.json
        - .workflow/artifacts/builder-agent/contract.json
        - .workflow/artifacts/verifier-agent/contract.json
      writes:
        - .workflow/artifacts/eval-agent/contract.json
        - .workflow/artifacts/eval-agent/dynamic_context.json
        - .workflow/artifacts/eval-agent/context_snapshot.md
        - .workflow/artifacts/eval-agent/eval_report.md
      protected:
        - src/**
        - tests/**
        - package.json
        - docs/specs/**
        - .workflow/artifacts/specs/**
        - .workflow/artifacts/test-agent/**
        - .workflow/artifacts/builder-agent/**
        - .workflow/artifacts/verifier-agent/**
